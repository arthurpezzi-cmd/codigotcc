<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>NÃO NASCEMOS PARA CABER — Câmera</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />

    <!-- A-Frame & MindAR via CDN -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body data-page="scanner">
    <div id="camera-overlay"></div>

    <div id="scanner-ui" class="visible">
      <div class="ar-top-row">
        <div class="group-header-bar">
          <a
            id="btn-back-home"
            href="./index.html"
            class="btn-back-arrow"
            aria-label="Voltar para o início"
          >
            &#8592;
          </a>
          <div id="group-tag" class="group-tag">
            <span id="status-dot" class="status-dot"></span>
            <span id="group-banner-text">Grupo 1 - Denúncia e Vigilância</span>
          </div>
        </div>
      </div>

      <!-- Guia de enquadramento enquanto procura um cartaz -->
      <div id="reticle" class="reticle-a3">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scanline"></div>
        <div class="reticle-caption">APONTE PARA O CARTAZ</div>
      </div>

      <!-- Bloco inferior: Seletor elevado + Card da personalidade -->
      <div id="personality-hud" class="bottom-panel" aria-live="polite">
        <div class="mode-tabs" role="tablist">
          <button
            id="tab-destaque"
            type="button"
            class="mode-tab is-active"
            role="tab"
            aria-selected="true"
          >
            DESTAQUE NA PESSOA
          </button>
          <button
            id="tab-planejamento"
            type="button"
            class="mode-tab"
            role="tab"
            aria-selected="false"
          >
            COMO FOI PLANEJADO
          </button>
        </div>

        <div id="group-card" class="group-card">
          <h2 id="hud-person-name" class="group-card-name">
            NOME DA PERSONALIDADE
          </h2>
          <div id="hud-person-dates" class="group-card-dates">
            26.04.1985 - 31.08.2026
          </div>
          <p id="hud-person-body" class="group-card-body">
            Fulano de tal foi tal coisa e marcou sua trajetória neste cartaz.
          </p>
        </div>
      </div>
    </div>

    <!-- CENA A-FRAME + MINDAR -->
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.005; warmupTolerance: 4; missTolerance: 10; maxTrack: 1;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true, alpha: true, powerPreference: high-performance"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script src="./dados.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
